<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar — Cancha Fútbol 5</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static\css\login.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
  </head>
  <body>
    <div class="login-wrap">
      <div class="logo">
        <span class="logo-icon">⚽</span>
        <div class="logo-title">
          Sistema de administracion de canchas de Fútbol 5
        </div>
        <div class="logo-sub">Panel de administración</div>
      </div>

      <div class="card">
        <div class="card-title">Ingresá con tu cuenta</div>

        {% if error %}
        <div class="error-msg"><span>⚠</span> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
          <div class="field">
            <label for="usuario">Usuario</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Tu usuario"
                autocomplete="username"
                autofocus
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-login">Ingresar</button>
        </form>
      </div>
    </div>
  </body>
</html>
